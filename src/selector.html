<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talkern · Compartir pantalla</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f7fa; --fg: #0f172a; --fg-2: #3f4b61; --card: #ffffff; --border: #d9dee8; --accent: #2f5bea; --accent-fg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121316; --fg: #e7e8ea; --fg-2: #b4bac6; --card: #1b1d23; --border: #2c3038; --accent: #7da2ff; --accent-fg: #0b1020; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; }
  header { padding: 16px 20px 8px; }
  h1 { margin: 0; font-size: 17px; }
  p { margin: 4px 0 0; color: var(--fg-2); }
  .tabs { display: flex; gap: 6px; padding: 8px 20px 0; }
  .tabs button { font: inherit; font-weight: 600; color: var(--fg); background: transparent; border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  main { flex: 1; overflow: auto; padding: 12px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; align-content: start; }
  .source { font: inherit; color: var(--fg); text-align: left; background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .source:hover, .source:focus-visible { border-color: var(--accent); outline: none; }
  .source img.thumb { width: 100%; aspect-ratio: 16 / 10; object-fit: contain; background: #000; border-radius: 6px; }
  .name { display: flex; align-items: center; gap: 6px; font-size: 12.5px; line-height: 1.3; overflow: hidden; }
  .name img { width: 16px; height: 16px; flex: none; }
  .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 20px 16px; border-top: 1px solid var(--border); }
  footer button { font: inherit; font-weight: 600; border-radius: 10px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--fg); }
  .empty { color: var(--fg-2); grid-column: 1 / -1; padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1 id="title">Compartir pantalla</h1>
  <p id="hint">Elige la pantalla o la ventana que verán los demás.</p>
</header>
<div class="tabs" role="tablist">
  <button type="button" role="tab" id="tab-screen" aria-selected="true">Pantallas</button>
  <button type="button" role="tab" id="tab-window" aria-selected="false">Ventanas</button>
</div>
<main id="list" role="list"><p class="empty" id="loading">Buscando…</p></main>
<footer><button type="button" id="cancel">Cancelar</button></footer>
<script>
  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "es";
  const texts = {
    es: { title: "Compartir pantalla", hint: "Elige la pantalla o la ventana que verán los demás.", screens: "Pantallas", windows: "Ventanas", loading: "Buscando…", none: "No hay nada que compartir.", cancel: "Cancelar", screen: "Pantalla" },
    en: { title: "Share screen", hint: "Choose the screen or window the others will see.", screens: "Screens", windows: "Windows", loading: "Looking…", none: "Nothing to share.", cancel: "Cancel", screen: "Screen" },
  }[lang];
  document.documentElement.lang = lang;
  document.title = "Talkern · " + texts.title;
  for (const [id, key] of [["title", "title"], ["hint", "hint"], ["tab-screen", "screens"], ["tab-window", "windows"], ["loading", "loading"], ["cancel", "cancel"]]) document.getElementById(id).textContent = texts[key];
  let sources = [];
  let kind = "screen";
  const list = document.getElementById("list");
  function render() {
    list.replaceChildren();
    const shown = sources.filter((s) => s.kind === kind);
    if (shown.length === 0) {
      const p = document.createElement("p"); p.className = "empty"; p.textContent = texts.none; list.append(p); return;
    }
    shown.forEach((s, i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "source"; b.setAttribute("role", "listitem");
      const img = document.createElement("img"); img.className = "thumb"; img.alt = ""; img.src = s.thumbnail;
      const name = document.createElement("div"); name.className = "name";
      if (s.icon) { const ic = document.createElement("img"); ic.alt = ""; ic.src = s.icon; name.append(ic); }
      const span = document.createElement("span"); span.textContent = s.kind === "screen" && shown.length > 1 ? texts.screen + " " + (i + 1) + (s.name ? " · " + s.name : "") : s.name || texts.screen; span.title = span.textContent; name.append(span);
      b.append(img, name);
      b.addEventListener("click", () => window.talkernSelector.pick(s.id));
      list.append(b);
    });
  }
  for (const k of ["screen", "window"]) {
    document.getElementById("tab-" + k).addEventListener("click", () => {
      kind = k;
      for (const j of ["screen", "window"]) document.getElementById("tab-" + j).setAttribute("aria-selected", String(j === k));
      render();
    });
  }
  window.talkernSelector.onSources((s) => { sources = Array.isArray(s) ? s : []; render(); });
  document.getElementById("cancel").addEventListener("click", () => window.talkernSelector.cancel());
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") window.talkernSelector.cancel(); });
</script>
</body>
</html>

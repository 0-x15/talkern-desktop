<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talkern · Sin conexión</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f7fa; --fg: #0f172a; --fg-2: #3f4b61; --accent: #2f5bea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121316; --fg: #e7e8ea; --fg-2: #b4bac6; --accent: #5b86ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-app-region: drag; }
  main { text-align: center; max-width: 36ch; padding: 24px; -webkit-app-region: no-drag; }
  .mark { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px; background: linear-gradient(135deg, #ff7a3d, #ff9a5c); }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--fg-2); margin: 0 0 18px; line-height: 1.5; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>Sin conexión</h1>
  <p id="msg">Talkern no está disponible ahora mismo. Se vuelve a intentar cada pocos segundos.</p>
  <button id="retry" type="button">Reintentar ahora</button>
</main>
<script>
  const site = new URLSearchParams(location.search).get("site") || "https://talkern.com";
  async function retry() {
    document.getElementById("msg").textContent = "Reintentando…";
    try {
      await fetch(site + "/login", { mode: "no-cors", cache: "no-store" });
      location.href = site;
    } catch {
      document.getElementById("msg").textContent = "Sigue sin conexión. Se vuelve a intentar cada pocos segundos.";
    }
  }
  document.getElementById("retry").addEventListener("click", retry);
  setInterval(retry, 5000);
</script>
</body>
</html>

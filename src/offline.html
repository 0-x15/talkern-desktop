<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talkern · Sin conexión</title>
<style>
  /* Los mismos tonos que la web; en oscuro el botón lleva tinta oscura sobre el acento claro para llegar al contraste AA (TK-024). */
  :root { color-scheme: light dark; --bg: #f5f7fa; --fg: #0f172a; --fg-2: #3f4b61; --accent: #2f5bea; --accent-fg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121316; --fg: #e7e8ea; --fg-2: #b4bac6; --accent: #7da2ff; --accent-fg: #0b1020; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-app-region: drag; }
  main { text-align: center; max-width: 36ch; padding: 24px; -webkit-app-region: no-drag; }
  .mark { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px; background: linear-gradient(135deg, #ff7a3d, #ff9a5c); }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--fg-2); margin: 0 0 18px; line-height: 1.5; }
  button { font: inherit; font-weight: 600; color: var(--accent-fg); background: var(--accent); border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1 id="title">Sin conexión</h1>
  <p id="msg">Talkern no está disponible ahora mismo. Se vuelve a intentar cada pocos segundos.</p>
  <button id="retry" type="button">Reintentar ahora</button>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const site = q.get("site") || "https://talkern.com";
  const lang = q.get("lang") === "en" ? "en" : "es";
  const texts = {
    es: { title: "Sin conexión", msg: "Talkern no está disponible ahora mismo. Se vuelve a intentar cada pocos segundos.", retrying: "Reintentando…", still: "Sigue sin conexión. Se vuelve a intentar cada pocos segundos.", retry: "Reintentar ahora", doc: "Talkern · Sin conexión" },
    en: { title: "You're offline", msg: "Talkern isn't reachable right now. It retries every few seconds.", retrying: "Retrying…", still: "Still offline. It retries every few seconds.", retry: "Retry now", doc: "Talkern · Offline" },
  }[lang];
  document.documentElement.lang = lang;
  document.title = texts.doc;
  document.getElementById("title").textContent = texts.title;
  document.getElementById("msg").textContent = texts.msg;
  document.getElementById("retry").textContent = texts.retry;
  async function retry() {
    document.getElementById("msg").textContent = texts.retrying;
    try {
      await fetch(site + "/login", { mode: "no-cors", cache: "no-store" });
      location.href = site + "/app";
    } catch {
      document.getElementById("msg").textContent = texts.still;
    }
  }
  document.getElementById("retry").addEventListener("click", retry);
  window.addEventListener("online", retry);
  setInterval(retry, 5000);
</script>
</body>
</html>
